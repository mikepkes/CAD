[package]
name = "vibecad"
version = "0.1.0"
description = "VibeCAD desktop app (Tauri shell around the web app, with a local MCP server)"
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[lib]
name = "vibecad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
axum = "0.8"
# Streams for the MCP endpoint's Server-Sent Events (already in the tree through axum).
futures-util = { version = "0.3", default-features = false }
# 3D mouse (3Dconnexion SpaceMouse) in the desktop app, where the webview has no WebHID.
# macos-shared-device opens it non-exclusively, so 3Dconnexion's own driver can keep it too.
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Loads 3Dconnexion's driver framework (3DxWare) at run time, when installed.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# hidapi needs exactly one Linux backend: hidraw through a pure-Rust udev, so the
# build needs no system libraries beyond Tauri's own (no libudev-dev or libusb).
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
