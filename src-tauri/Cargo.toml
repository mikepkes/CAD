[package]
name = "chisel-cad"
version = "0.1.0"
description = "Chisel CAD desktop app (Tauri shell around the web app, with a local MCP server)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chisel_cad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
axum = "0.8"
# 3D mouse (3Dconnexion SpaceMouse) in the desktop app, where the webview has no WebHID.
# macos-shared-device opens it non-exclusively, so 3Dconnexion's own driver can keep it too.
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
